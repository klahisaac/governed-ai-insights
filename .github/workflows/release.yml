# After ci passes on main: build the image once, push it, deploy it to the production AKS
# cluster by digest, and run the smoke test there, where the app reads Databricks through
# Workload Identity. Staging is stopped (az aks stop) to save cost, so pull request CI on kind is
# the test before production. redeploy puts an earlier commit's image back.
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  production:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write  # OIDC token for the production deploy identity
    env:
      COMMIT: ${{ github.event.workflow_run.head_sha }}
      REPOSITORY: ${{ vars.ACR_NAME }}.azurecr.io/ai-insight-platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push the image
        run: |
          az acr login -n "${{ vars.ACR_NAME }}"
          docker build --build-arg VERSION="$COMMIT" -t "$REPOSITORY:$COMMIT" .
          docker push "$REPOSITORY:$COMMIT"
          echo "IMAGE=$(docker inspect --format '{{index .RepoDigests 0}}' "$REPOSITORY:$COMMIT")" >> "$GITHUB_ENV"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
      - uses: azure/use-kubelogin@0ce7c36141aa27d4934872cf00b0120804c98a29  # v1.3
        with:
          kubelogin-version: v0.2.21
      - name: Connect to the production cluster
        run: |
          az aks get-credentials -g "${{ vars.AKS_RESOURCE_GROUP }}" -n "${{ vars.AKS_CLUSTER }}" --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli
      - run: deploy/deploy.sh production "$IMAGE"
      - run: deploy/smoke-test.sh
        env:
          SMOKE_WAREHOUSE: databricks
      - name: Summary
        run: |
          {
            echo "Production runs \`$IMAGE\` (commit $COMMIT)."
            echo
            echo "Roll back: \`gh workflow run redeploy -f commit=<earlier sha>\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Show cluster state
        if: failure()
        run: |
          kubectl get pods -A
          kubectl describe deployment insight-platform -n insight
          kubectl logs -n insight deployment/insight-platform --all-containers --tail 100
