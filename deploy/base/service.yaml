apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: insight-data
  namespace: insight
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: insight-platform
  namespace: insight
  labels:
    app.kubernetes.io/name: insight-platform
spec:
  selector:
    app.kubernetes.io/name: insight-platform
  ports:
    - { name: http, port: 80, targetPort: http }
