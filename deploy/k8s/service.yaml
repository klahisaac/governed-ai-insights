apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: insight-data
  namespace: insight
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: insight-platform
  namespace: insight
  labels:
    app.kubernetes.io/name: insight-platform
spec:
  selector:
    app.kubernetes.io/name: insight-platform
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: insight-platform
  namespace: insight
spec:
  parentRefs:
    - { group: gateway.networking.k8s.io, kind: Gateway, name: lab-gateway, namespace: gateway, sectionName: https }
  hostnames: ["insight.k8s.internal"]
  rules:
    # /metrics is for Prometheus inside the cluster only.
    - matches:
        - path: { type: PathPrefix, value: /metrics }
      filters:
        - type: RequestRedirect
          requestRedirect: { path: { type: ReplaceFullPath, replaceFullPath: / }, statusCode: 302 }
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - { group: "", kind: Service, name: insight-platform, port: 80, weight: 1 }
