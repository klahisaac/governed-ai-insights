# The production AKS cluster (deploy/azure/provision.sh). deploy/deploy.sh sets the image to the
# registry digest being deployed; the tag below only names the repository.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ingress.yaml
components:
  - ../../components/aks
images:
  - name: ai-insight-platform
    newName: acrgovernedaiinsights.azurecr.io/ai-insight-platform
    newTag: set-by-deploy
patches:
  - target: { kind: ServiceAccount, name: insight-platform }
    patch: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: insight-platform
        namespace: insight
        annotations:
          azure.workload.identity/client-id: c3c08d26-a3d9-44e9-93b0-1dcf2649bc8d  # id-governed-ai-insights-app-production
  - target: { kind: Deployment, name: insight-platform }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: insight-platform, namespace: insight }
      spec:
        template:
          spec:
            containers:
              - name: insight
                env:
                  - { name: DATABRICKS_SCHEMA, value: pharmaceutical_production }
                  - { name: INSIGHT_PUBLIC, value: "1" }  # reachable from the internet (ingress.yaml)
                  - { name: OTEL_RESOURCE_ATTRIBUTES, value: "deployment.environment=production,k8s.namespace.name=insight" }
