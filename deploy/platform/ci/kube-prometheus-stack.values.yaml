# kind in CI, on top of ../kube-prometheus-stack.values.yaml: without the parts a smoke test does
# not need (Alertmanager, node and control plane scraping), so it fits on a GitHub runner, and with
# shorter intervals so the first scrape comes sooner.
alertmanager:
  enabled: false
nodeExporter:
  enabled: false
kubeEtcd: { enabled: false }
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }
prometheus:
  prometheusSpec:
    scrapeInterval: 15s
    evaluationInterval: 15s
